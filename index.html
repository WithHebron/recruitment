<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채용 | 위드헤브론</title>
  
  <!-- 폰트 로드: 나눔명조 & Pretendard -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
  
  <!-- 파비콘 -->
  <link rel="icon" type="image/png" href="assets/WH-로고-하트.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .font-myeongjo {
      font-family: 'Nanum Myeongjo', serif;
    }
    .bg-brand-red { background-color: #E5254E; }
    .text-brand-red { color: #E5254E; }
    .bg-brand-blue { background-color: #00B5EC; }
    .text-brand-blue { color: #00B5EC; }
    .bg-brand-yellow { background-color: #F5C827; }
    .text-brand-yellow { color: #F5C827; }
    .bg-brand-green { background-color: #68B04D; }
    .text-brand-green { color: #68B04D; }
    .bg-dark-green { background-color: #0E352E; }
  </style>
</head>
<body class="bg-[#FAF9F6] text-slate-800 flex flex-col min-h-screen">

  <!-- Header / Navigation (Greeting style) -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="#" class="flex items-center space-x-3">
        <img src="assets/로고_투명.png" alt="WithHebron Logo" class="h-10 w-auto object-contain" onerror="this.style.display='none'; document.getElementById('txt-logo').classList.remove('hidden');">
        <span id="txt-logo" class="hidden font-myeongjo font-bold text-xl text-slate-900 tracking-tight">WITHHEBRON</span>
      </a>
      <nav class="hidden md:flex space-x-8 text-sm font-medium text-slate-600">
        <a href="#about" class="hover:text-brand-blue transition">소개</a>
        <a href="#culture" class="hover:text-brand-blue transition">일하는 방식</a>
        <a href="#benefits" class="hover:text-brand-blue transition">복리후생</a>
        <a href="#team" class="hover:text-brand-blue transition">조직도</a>
        <a href="#jobs" class="hover:text-brand-blue transition text-brand-blue font-bold">채용공고</a>
      </nav>
    </div>
  </header>

  <!-- Greeting 스타일 히어로 섹션 -->
  <section class="bg-dark-green text-white py-20 px-6 text-center space-y-6">
    <div class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-sm text-brand-yellow border border-white/20 text-xs font-semibold px-4 py-1.5 rounded-full">
      <span class="w-2 h-2 rounded-full bg-brand-yellow animate-pulse"></span> 위드헤브론 인재채용
    </div>
    <h1 class="font-myeongjo text-3xl md:text-5xl font-extrabold leading-tight tracking-tight max-w-4xl mx-auto">
      위드헤브론과 함께 캄보디아 현장의 환우와 의료진에게<br class="hidden md:block"> 희망을 전할 동반자를 기다립니다. 💖
    </h1>
    <p class="text-sm md:text-base text-slate-300 max-w-2xl mx-auto font-light leading-relaxed">
      캄보디아와 국제보건 분야에 열정과 관심이 있는 분들의 많은 지언 바랍니다.
    </p>
  </section>

  <main class="flex-grow max-w-6xl w-full mx-auto px-6 py-16 space-y-20">
    
    <!-- 1. 채용공고 목록 (Greeting 카드 탭 디자인) -->
    <section id="jobs" class="space-y-8">
      <div class="flex flex-col md:flex-row md:items-end justify-between border-b pb-4 border-slate-200 gap-4">
        <div>
          <span class="text-xs font-bold text-brand-blue uppercase tracking-wider">Open Positions</span>
          <h2 class="font-myeongjo text-3xl font-bold text-slate-900 mt-1">지원 가능한 채용 공고</h2>
        </div>
        
        <!-- 공고 필터 탭 (전체 / 진행 중 / 마감) -->
        <div class="flex space-x-2 bg-slate-200/60 p-1 rounded-xl text-xs font-semibold">
          <button onclick="filterJobs('ALL')" id="tab-ALL" class="px-4 py-2 rounded-lg bg-white text-slate-900 shadow-sm transition">전체</button>
          <button onclick="filterJobs('OPEN')" id="tab-OPEN" class="px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition">진행 중</button>
          <button onclick="filterJobs('CLOSED')" id="tab-CLOSED" class="px-4 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition">마감</button>
        </div>
      </div>

      <div id="job-list" class="space-y-4">
        <div class="p-8 bg-white rounded-2xl border border-slate-200/80 text-center text-slate-400">
          공고를 불러오는 중입니다...
        </div>
      </div>
    </section>

    <!-- 2. 회사소개 -->
    <section id="about" class="bg-white p-10 rounded-3xl border border-slate-200/70 shadow-sm space-y-4">
      <div class="inline-block px-3 py-1 bg-rose-50 text-brand-red rounded-lg text-xs font-bold">About Us</div>
      <h3 class="font-myeongjo text-2xl font-bold text-slate-900">따뜻한 나눔으로 소망을 더하는 위드헤브론</h3>
      <p class="text-slate-600 leading-relaxed text-sm md:text-base">
        남겨주신 따뜻한 기도와 응원이 캄보
