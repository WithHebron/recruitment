<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>채용 관리자 시스템 | 위헤브론</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <header class="bg-slate-900 text-white py-4 px-6 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold">위헤브론 채용 관리 시스템 (Admin)</h1>
      <span class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full">Static Mode</span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6 space-y-6">
    <div class="flex justify-between items-center">
      <h2 class="text-xl font-bold text-slate-900">공고 관리 게시판</h2>
      <div class="space-x-2">
        <button onclick="openForm()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">+ 새 공고 작성</button>
        <button onclick="exportJSON()" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-semibold hover:bg-emerald-700">💾 jobs.json 다운로드</button>
      </div>
    </div>

    <!-- 공고 목록 테이블 -->
    <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase">
          <tr>
            <th class="p-4">상태</th>
            <th class="p-4">공고명</th>
            <th class="p-4">모집기간</th>
            <th class="p-4 text-right">관리</th>
          </tr>
        </thead>
        <tbody id="admin-job-list" class="divide-y divide-slate-100 text-sm">
          <!-- JS로 동적 생성 -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- 작성/수정 모달 -->
  <div id="form-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-xl">
      <h3 id="form-title" class="text-lg font-bold text-slate-900 border-b pb-3">공고 작성</h3>
      <form id="job-form" onsubmit="saveJob(event)" class="space-y-3">
        <input type="hidden" id="job-id">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">공고명 *</label>
          <input type="text" id="job-title" required class="w-full border rounded-lg p-2.5 text-sm outline-none focus:border-blue-600">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">시작일 *</label>
            <input type="date" id="job-start" required class="w-full border rounded-lg p-2.5 text-sm outline-none focus:border-blue-600">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">마감일 *</label>
            <input type="date" id="job-end" required class="w-full border rounded-lg p-2.5 text-sm outline-none focus:border-blue-600">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">이력서 양식 파일 경로/링크</label>
          <input type="text" id="job-resume" placeholder="./assets/resume_template.docx" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:border-blue-600">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">공고 상세설명</label>
          <textarea id="job-desc" rows="3" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:border-blue-600"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">강제 상태 변경</label>
          <select id="job-status" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:border-blue-600">
            <option value="AUTO">자동 (날짜 기반)</option>
            <option value="OPEN">진행 중 (강제)</option>
            <option value="CLOSED">마감 (강제)</option>
          </select>
        </div>
        <div class="pt-2 flex justify-end space-x-2">
          <button type="button" onclick="closeForm()" class="px-4 py-2 border rounded-lg text-sm text-slate-600 hover:bg-slate-50">취소</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">저장</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let jobs = [];

    async function init() {
      try {
        const res = await fetch('./jobs.json');
        jobs = await res.json();
      } catch (e) {
        jobs = JSON.parse(localStorage.getItem('jobs_data') || '[]');
      }
      renderAdminList();
    }

    function isOngoing(job) {
      if (job.status === 'CLOSED') return false;
      if (job.status === 'OPEN') return true;
      const today = new Date().toISOString().split('T')[0];
      return job.endDate >= today;
    }

    function renderAdminList() {
      const tbody = document.getElementById('admin-job-list');
      if (jobs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400">등록된 공고가 없습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = jobs.map(job => {
        const ongoing = isOngoing(job);
        const statusBadge = ongoing
          ? `<span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded text-xs font-bold">[진행 중]</span>`
          : `<span class="px-2 py-0.5 bg-slate-100 text-slate-500 rounded text-xs font-bold">[마감]</span>`;

        return `
          <tr class="hover:bg-slate-50">
            <td class="p-4">${statusBadge}</td>
            <td class="p-4 font-semibold text-slate-900">${job.title}</td>
            <td class="p-4 text-xs text-slate-500">${job.startDate} ~ ${job.endDate}</td>
            <td class="p-4 text-right space-x-2">
              <button onclick="editJob(${job.id})" class="text-blue-600 hover:underline text-xs font-semibold">수정</button>
              <button onclick="deleteJob(${job.id})" class="text-red-600 hover:underline text-xs font-semibold">삭제</button>
            </td>
          </tr>
        `;
      }).join('');

      localStorage.setItem('jobs_data', JSON.stringify(jobs));
    }

    function openForm() {
      document.getElementById('form-title').innerText = '공고 작성';
      document.getElementById('job-id').value = '';
      document.getElementById('job-form').reset();
      document.getElementById('form-modal').classList.remove('hidden');
    }

    function closeForm() {
      document.getElementById('form-modal').classList.add('hidden');
    }

    function editJob(id) {
      const job = jobs.find(j => j.id === id);
      if (!job) return;

      document.getElementById('form-title').innerText = '공고 수정';
      document.getElementById('job-id').value = job.id;
      document.getElementById('job-title').value = job.title;
      document.getElementById('job-start').value = job.startDate;
      document.getElementById('job-end').value = job.endDate;
      document.getElementById('job-resume').value = job.resumeUrl || '';
      document.getElementById('job-desc').value = job.description || '';
      document.getElementById('job-status').value = job.status || 'AUTO';

      document.getElementById('form-modal').classList.remove('hidden');
    }

    function saveJob(e) {
      e.preventDefault();
      const id = document.getElementById('job-id').value;
      const jobData = {
        id: id ? parseInt(id) : Date.now(),
        title: document.getElementById('job-title').value,
        startDate: document.getElementById('job-start').value,
        endDate: document.getElementById('job-end').value,
        resumeUrl: document.getElementById('job-resume').value,
        description: document.getElementById('job-desc').value,
        status: document.getElementById('job-status').value
      };

      if (id) {
        const index = jobs.findIndex(j => j.id === parseInt(id));
        jobs[index] = jobData;
      } else {
        jobs.push(jobData);
      }

      renderAdminList();
      closeForm();
    }

    function deleteJob(id) {
      if (confirm('정말 삭제하시겠습니까?')) {
        jobs = jobs.filter(j => j.id !== id);
        renderAdminList();
      }
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(jobs, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "jobs.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      alert("다운로드된 jobs.json 파일을 GitHub 저장소 루트에 덮어씌워 커밋(Commit)하세요!");
    }

    window.onload = init;
  </script>
</body>
</html>
